# zram 配置 —— 由 scripts/linux/storage.sh 安装到 /etc/systemd/zram-generator.conf
# 设计依据:决策 3.8(无 swap 分区:zram ~8GiB + swapfile 4GiB、不做休眠)与措施 R6(OOM 与内存压力防护)。
# 生效前提:已装 systemd-zram-generator 包(apt install -y systemd-zram-generator);
#          本文件存在时,启动 systemd-zram-setup@zram0.service 才会创建 /dev/zram0 作为交换设备。
# 生效方式:systemctl daemon-reload && systemctl restart systemd-zram-setup@zram0.service
# 调整方式:改下方容量表达式后按上一行重载;不动分区表即可随时收回或放大(决策 3.8 的可调整性)。
# 取值说明:容量取"内存一半"与 8192(MiB)的较小者,故 16GiB 及以上内存的机器得到约 8GiB;
#          本配置的交换优先级为 100,高于 swapfile 的默认优先级(-2):内核先压 zram,swapfile 兜底。
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
