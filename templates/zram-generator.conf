# zram 配置 —— 备用模板(Ubuntu 优先 systemd-zram-generator,退化 zram-tools)
# 说明:Ubuntu 不保证预装 systemd-zram-generator,`zramctl` 列出 zram0 才算已生效;
#       本文件只在"zram0 缺失、需要显式补配置"时由 scripts/linux/storage.sh 安装到
#       /etc/systemd/zram-generator.conf,并标明**需重启**(见 05-6 卡)。
#       该脚本先试 apt 装 systemd-zram-generator;装不上时退化到 zram-tools(写 /etc/default/zramswap),
#       两条路径的判据都是"重启后 zramctl 列出 zram0"。
# 设计依据:决策 3.8(无 swap 分区:zram ~8GiB + swapfile 4GiB、不做休眠)与措施 R6(OOM 与内存压力防护)。
# 生效前提:镜像已含 systemd-zram-generator(zram0 缺失时按 05-6 用 apt 装上);
#          本文件存在时,启动 systemd-zram-setup@zram0.service 才会创建 /dev/zram0 作为交换设备。
# 生效方式:systemctl daemon-reload && systemctl restart systemd-zram-setup@zram0.service
# 调整方式:改下方容量表达式后按上一行重载;不动分区表即可随时收回或放大(决策 3.8 的可调整性)。
# 取值说明:容量取"内存一半"与 8192(MiB)的较小者,故 16GiB 及以上内存的机器得到约 8GiB;
#          本配置的交换优先级为 100,高于 swapfile 的默认优先级(-2):内核先压 zram,swapfile 兜底。
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
